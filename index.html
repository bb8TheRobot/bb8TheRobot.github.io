<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>bb8therobot</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    position: relative;
  }
  body {
    overflow: hidden;
  }
  .heart {
    padding: 5vw;
    font-size: 20vw;
    color: #ff2e63;
    filter: drop-shadow(0 0 10px #ff2e6360);
    user-select: none;
    cursor: pointer;
    will-change: transform;
  }
  .download {
    padding: 1em 2.5em;
    font-size: 1.3rem;
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: #ff2e63;
    background: #1a1a1a;
    border: 2px solid #ff2e63;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 0 15px #ff2e6350;
    transition: all 0.2s ease;
  }
  .download:hover {
    background: #ff2e63;
    color: #0d0d0d;
    box-shadow: 0 0 30px #ff2e63;
    transform: scale(1.05);
  }
  .flash {
    position: fixed;
    inset: 0;
    background: #ff0022;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  .bloodOverlay {
    position: fixed;
    inset: 0;
    background: #6a000f;
    opacity: 0;
    pointer-events: none;
    z-index: 8;
  }
  .drip {
    position: fixed;
    top: -5vh;
    width: 3vw;
    min-width: 18px;
    height: 0;
    background: linear-gradient(#8a0011, #4d0009);
    border-radius: 0 0 50% 50% / 0 0 30% 30%;
    box-shadow: 0 0 10px #00000080;
    z-index: 10;
    transform-origin: top;
  }
</style>
</head>
<body>
  <div class="heart" id="heart">&#10084;</div>
  <a class="download" href="hi.py" download>HI &lt;3</a>
  <div class="flash" id="flash"></div>
  <div class="bloodOverlay" id="bloodOverlay"></div>

<script>
const heart = document.getElementById('heart');
const flash = document.getElementById('flash');
const bloodOverlay = document.getElementById('bloodOverlay');

let cycleDuration = 1000;
let hits = 0;
const maxHits = 6;
let popped = false;
let startTime = performance.now();

const sweetSpot = { start: 0.12, end: 0.19 };

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playHeartbeat(type) {
  const ctx = ensureAudio();
  const t0 = ctx.currentTime;
  const isLub = type === 'lub';
  const startFreq = isLub ? 160 : 130;
  const endFreq = isLub ? 45 : 40;
  const vol = isLub ? 0.5 : 0.35;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(startFreq, t0);
  osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + 0.12);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.2);
}

function playPop() {
  const ctx = ensureAudio();
  const bufferSize = ctx.sampleRate * 0.4;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1200, ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.4);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.9, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start();
}

function shakeScreen(duration, maxAmp) {
  const start = performance.now();
  function frame(now) {
    const t = now - start;
    if (t > duration) {
      document.body.style.transform = '';
      return;
    }
    const amp = maxAmp * (1 - t / duration);
    const dx = (Math.random() * 2 - 1) * amp;
    const dy = (Math.random() * 2 - 1) * amp;
    document.body.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function heartScale(phase) {
  if (phase < 0.15) return 1 + 0.15 * (phase / 0.15);
  if (phase < 0.30) return 1.15 - 0.15 * ((phase - 0.15) / 0.15);
  if (phase < 0.45) return 1 + 0.10 * ((phase - 0.30) / 0.15);
  if (phase < 0.60) return 1.10 - 0.10 * ((phase - 0.45) / 0.15);
  return 1;
}

function getPhase(now) {
  const elapsed = (now - startTime) % cycleDuration;
  return elapsed / cycleDuration;
}

let lastPhase = 1;

function tick(now) {
  if (!popped) {
    const phase = getPhase(now);
    heart.style.transform = `scale(${heartScale(phase)})`;
    if (phase < lastPhase) {
      playHeartbeat('lub');
    } else if (lastPhase < 0.30 && phase >= 0.30) {
      playHeartbeat('dub');
    }
    lastPhase = phase;
    requestAnimationFrame(tick);
  }
}
requestAnimationFrame(tick);

heart.addEventListener('click', () => {
  if (popped) return;
  const ctx = ensureAudio();
  if (ctx.state === 'suspended') ctx.resume();
  const phase = getPhase(performance.now());
  if (phase >= sweetSpot.start && phase <= sweetSpot.end) {
    hits++;
    startTime = performance.now();
    lastPhase = 1;
    cycleDuration *= 0.78;
    if (hits >= maxHits - 2) {
      shakeScreen(400, (hits - (maxHits - 3)) * 6);
    }
    if (hits >= maxHits) {
      pop();
    }
  }
});

function pop() {
  popped = true;
  heart.style.transition = 'transform 0.15s ease-out, opacity 0.15s ease-out';
  heart.style.transform = 'scale(2.5)';
  heart.style.opacity = '0';
  flash.style.transition = 'opacity 0.1s ease-out';
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.transition = 'opacity 0.6s ease-in'; flash.style.opacity = '0'; }, 120);
  playPop();
  shakeScreen(600, 25);
  startBloodBuildup();
}

function spawnDrips(count, sizeMin, sizeMax, maxStagger) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const drip = document.createElement('div');
      drip.className = 'drip';
      drip.style.left = Math.random() * 100 + 'vw';
      drip.style.width = (2 + Math.random() * 2.5) + 'vw';
      const duration = 0.8 + Math.random() * 1.2;
      const finalHeight = sizeMin + Math.random() * (sizeMax - sizeMin);
      drip.animate(
        [{ height: '0vh' }, { height: finalHeight + 'vh' }],
        { duration: duration * 1000, easing: 'cubic-bezier(.2,.6,.3,1)', fill: 'forwards' }
      );
      document.body.appendChild(drip);
    }, Math.random() * maxStagger);
  }
}

function startBloodBuildup() {
  let round = 0;
  let level = 0;
  spawnDrips(10, 30, 60, 120);
  const interval = setInterval(() => {
    round++;
    spawnDrips(4 + round * 2, 40 + round * 5, 90 + round * 8, 300);
    level += 0.08 + round * 0.01;
    bloodOverlay.style.opacity = Math.min(level, 1);
    if (level >= 1) {
      clearInterval(interval);
      setTimeout(downloadReadme, 500);
    }
  }, 450);
}

function downloadReadme() {
  const blob = new Blob(["Why did you do that.\nyou broke my heart"], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'README.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
