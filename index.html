<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bb8therobot</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: #0d0d0d;
  }
  /* nur body ist flex-container - html mit rein zu nehmen schrumpft body auf inhaltsbreite */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4vh;
    overflow: hidden;
  }
  .clickme {
    padding: 1.2em 3.2em;
    font-size: clamp(1.2rem, 5vw, 2rem);
    font-family: Arial, sans-serif;
    font-weight: bold;
    letter-spacing: 0.12em;
    color: #fff;
    background: #e10025;
    border: 3px solid #ff5a72;
    border-radius: 16px;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 0 30px #e1002580, inset 0 -6px 0 #8e000f;
    transition: box-shadow 0.2s ease, transform 0.08s ease;
  }
  .clickme:hover {
    box-shadow: 0 0 45px #e10025, inset 0 -6px 0 #8e000f;
  }
  .clickme:active {
    transform: translateY(4px) scale(0.97);
    box-shadow: 0 0 15px #e10025, inset 0 -1px 0 #8e000f;
  }
  .clickme.unleashed {
    animation: spin 0.4s linear infinite;
    box-shadow: 0 0 60px #e10025, inset 0 -6px 0 #8e000f;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .download {
    padding: 1em 2.5em;
    font-size: 1.1rem;
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: #ff2e63;
    background: #1a1a1a;
    border: 2px solid #ff2e63;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 0 15px #ff2e6350;
    transition: all 0.2s ease;
  }
  .download:hover {
    background: #ff2e63;
    color: #0d0d0d;
    box-shadow: 0 0 30px #ff2e63;
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <button class="clickme" id="clickme" type="button">CLICK ME</button>
  <a class="download" href="hi.py" download>HI &lt;3</a>

<script>
/* pro klick 0.1s vom song - fortlaufend, nie von vorn. ab 20 klicks der ganze song auf loop */
const clickBtn = document.getElementById('clickme');
const SNIPPET = 0.1;
const LOOP_AT = 20;

let audioCtx = null;
let songBuf = null;
let songOffset = 0;
let songClicks = 0;
let looping = false;
let loopSrc = null;
let snippetSrc = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

fetch('oiia.mp3')
  .then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.arrayBuffer();
  })
  .then(data => ensureAudio().decodeAudioData(data))
  .then(buf => { songBuf = buf; })
  .catch(err => { console.warn('oiia.mp3 nicht ladbar - button bleibt stumm:', err); });

function playSnippet() {
  const ctx = ensureAudio();
  if (snippetSrc) {
    try { snippetSrc.stop(); } catch (e) {}
  }
  const src = ctx.createBufferSource();
  src.buffer = songBuf;
  // kurze rampen, sonst knackt der harte schnitt bei 0.1s
  const gain = ctx.createGain();
  const t0 = ctx.currentTime;
  const fade = 0.008;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(1, t0 + fade);
  gain.gain.setValueAtTime(1, t0 + SNIPPET - fade);
  gain.gain.linearRampToValueAtTime(0, t0 + SNIPPET);
  src.connect(gain).connect(ctx.destination);
  src.start(t0, songOffset % songBuf.duration, SNIPPET);
  src.onended = () => { if (snippetSrc === src) snippetSrc = null; };
  snippetSrc = src;
  songOffset = (songOffset + SNIPPET) % songBuf.duration;
}

function startLoop() {
  if (looping) return;
  looping = true;
  const ctx = ensureAudio();
  if (snippetSrc) {
    try { snippetSrc.stop(); } catch (e) {}
    snippetSrc = null;
  }
  const src = ctx.createBufferSource();
  src.buffer = songBuf;
  src.loop = true;
  src.connect(ctx.destination);
  src.start(0, songOffset % songBuf.duration);
  loopSrc = src;
  clickBtn.classList.add('unleashed');
}

clickBtn.addEventListener('click', () => {
  const ctx = ensureAudio();
  if (ctx.state === 'suspended') ctx.resume();
  if (!songBuf || looping) return;
  songClicks++;
  if (songClicks >= LOOP_AT) {
    startLoop();
  } else {
    playSnippet();
  }
});
</script>
</body>
</html>
